server {
    listen 443 ssl;
    server_name xmqibu.com www.xmqibu.com;
    ssl_certificate /etc/letsencrypt/live/xmqibu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xmqibu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /www/xmqibu-ai/site/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Cache-Control "no-cache" always;
    location ^~ /.well-known/acme-challenge/ { root /opt/nginx-proxy/conf.d/acme; }
    location = /verification.html { alias /www/xmqibu-ai/site/verification.html; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}

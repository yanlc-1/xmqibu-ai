limit_req_zone $binary_remote_addr zone=xmqibu_ai_webhook:10m rate=10r/m;

server {
    listen 443 ssl;
    server_name xmqibu.com www.xmqibu.com;
    ssl_certificate /etc/letsencrypt/live/xmqibu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xmqibu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;

    location ^~ /.well-known/acme-challenge/ { root /opt/nginx-proxy/conf.d/acme; }
    location = /verification.html { alias /www/xmqibu-ai/site/verification.html; }
    location ~ /\. { deny all; }
    location = /-/github-webhook {
        limit_except POST { deny all; }
        limit_req zone=xmqibu_ai_webhook burst=5 nodelay;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:19095;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location / {
        proxy_pass http://127.0.0.1:19092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}

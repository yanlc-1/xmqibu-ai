name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=low
      - run: php -n tests/validate.php && php -n tests/dedupe.php
      - run: php tests/web.php
      - run: for file in scripts/*.php src/*.php web/*.php; do php -n -l "$file" || exit 1; done
